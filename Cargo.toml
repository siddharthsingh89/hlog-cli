[package]
name = "hlog"
version = "0.4.0"
edition = "2021"
description = "hlog — a log for humans. Append, tail and grep your hlog from the terminal."
license = "MIT"
repository = "https://github.com/siddharthsingh89/hlog-cli"
homepage = "https://hlog.dev"
documentation = "https://hlog.dev/docs/cli"
readme = "README.md"
keywords = ["cli", "log", "journal", "devlog", "terminal"]
categories = ["command-line-utilities"]
rust-version = "1.74"
# CI config isn't part of the crate.
exclude = [".github/", ".gitignore"]

[[bin]]
name = "hlog"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
